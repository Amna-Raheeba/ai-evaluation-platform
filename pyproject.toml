[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-evaluation-platform"
version = "0.2.0"
description = "Production-grade evaluation and regression platform for heterogeneous AI agents: versioned golden datasets, deterministic + judge metrics, statistical regression gates, failure analysis."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Amna Raheeba" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi"]
dashboard = ["streamlit"]

[tool.setuptools.packages.find]
include = ["eval_platform*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
